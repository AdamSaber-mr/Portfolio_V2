name: CI

# Bouwt elke pull request en elke push. `npm run build` draait `tsc -b`, dus dit
# vangt type-fouten voordat ze op de live site staan.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
