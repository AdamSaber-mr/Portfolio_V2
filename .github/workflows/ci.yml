name: CI

# Bouwt en controleert elke pull request en elke push.
#
# `npm run build` draait `tsc -b`, dus dit vangt type-fouten voordat ze op de
# live site staan. Daarna bewaakt `check-colors` het kleurcontract en draaien de
# Playwright-tests tegen de gebouwde site — die tests bestonden al, maar liepen
# tot nu toe alleen lokaal, waar je ze moet onthouden.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check-colors
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
